name: CPU checks

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:scripts:tests:_isaaclab/source/isaaclab:_isaaclab/source/isaaclab_experimental
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - name: Check out the training SDK utilities
        uses: actions/checkout@v4
        with:
          repository: isaac-sim/IsaacLab
          ref: ffff603eafc6b74264a5261cc0183d6a65390d78
          path: _isaaclab
          sparse-checkout: |
            source/isaaclab
            source/isaaclab_experimental
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip install -e .
          python -m pip check
      - name: Check essential training interfaces
        if: github.event_name != 'workflow_dispatch'
        run: |
          python -m pytest -q --tb=short \
            tests/test_training_profile.py \
            tests/test_training_cli_commands.py \
            tests/test_paired_leg_target_winding.py \
            tests/test_round_trip_transport.py \
            tests/test_recovery_rollout_mask.py \
            tests/test_small_rough_course.py \
            tests/test_tracking_reward_repair.py
      - name: Run complete CPU regression suite
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest tests -q --tb=short
