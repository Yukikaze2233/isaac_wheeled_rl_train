name: tests
on: [push, pull_request]
env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (CPU torch + rsl_rl)
        run: |
          # Install the matching CPU pair before resolving RSL's torchvision dependency.
          python -m pip install "torch==2.7.0+cpu" "torchvision==0.22.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "rsl-rl-lib==2.3.3" "numpy==2.4.6" "tensorboard==2.21.0"
          python -m pip check
      - name: Unit suites
        run: |
          export PYTHONPATH=src:tests
          python tests/test_mdp.py
          python tests/test_env_features.py
          python tests/test_season_features.py
      - name: Convergence suites
        run: |
          export PYTHONPATH=src:tests
          python tests/test_algorithms.py
          python tests/test_rsl_rl_smoke.py
          python tests/test_rsl_rl_branches.py
          python tests/test_experiments.py
  v40:
    # isaac60 uses RSL 5 / Lab 3; legacy toy environments and branch policies use RSL 2.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V40 CPU test dependencies
        run: |
          python -m pip install "torch==2.11.0+cpu" "torchvision==0.26.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          # MuJoCo 3.12 fixes nativeccd's false zero mesh distances (upstream issue #3383).
          python -m pip install "rsl-rl-lib==5.5.1" "tensordict==0.14.2" "tensorboard==2.21.0" "numpy==2.4.6" "pytest==9.1.1" "scipy==1.17.1" "mujoco==3.12.0" "onnx==1.23.0rc1" "onnxruntime==1.30.0"
          python -m pip install "imageio==2.37.4" "imageio-ffmpeg==0.6.0" "Pillow==12.3.0" "warp-lang==1.13.0" "psutil==7.2.2"
          python -m pip check
          # Fail on missing audit or recording dependencies rather than silently skipping them.
          python -c "import torch, torchvision, scipy.spatial, mujoco, onnx, onnxruntime, imageio.v2, imageio_ffmpeg, PIL.Image, warp; from tensordict import TensorDict; from rsl_rl.models import MLPModel; from rsl_rl.runners import OnPolicyRunner; assert torch.__version__ == '2.11.0+cpu'; assert torchvision.__version__ == '0.26.0+cpu'"
      - name: V40 CPU suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests/v40 tests/test_onnx_replay.py scripts/round3/test_tools.py -q -ra
