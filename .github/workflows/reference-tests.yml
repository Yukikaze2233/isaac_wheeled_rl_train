name: command-reference-tests
on: [push, pull_request]
jobs:
  reference-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install "torch==2.7.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest>=8,<10" numpy
      - name: Reference, migration and progression contracts
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: >-
          python -m pytest -q
          tests/test_reference_remediation.py
          tests/test_v6_continuation.py
          tests/test_physics_resume.py
          tests/test_precision_recovery.py
          tests/test_dynamics_randomization.py
          tests/test_step_assist.py
          tests/test_emergency_curriculum.py
          tests/test_chassis_task.py
          tests/test_chassis_evaluation.py
          tests/test_chassis_blocks.py
          tests/test_full_orchestration.py
          tests/test_scut_observation.py
          tests/test_scut_skills.py
          tests/test_integrated_curriculum.py
